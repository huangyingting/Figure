name: figure
services:
  web:
    image: ${FIGURE_IMAGE:?Set FIGURE_IMAGE to a verified release image}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3210:3000"
    volumes:
      - /opt/webstack/figure/.env:/app/.env:ro
      - /opt/webstack/figure/data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
